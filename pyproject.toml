[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "codecard"
version = "0.1.0"
description = "Render code, logs and stack traces as clean cards for social feeds, and refuse to render the ones that leak your codebase."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Dmitry Semenkevich", email = "dimhold@gmail.com" }]
keywords = [
    "code",
    "screenshot",
    "image",
    "syntax-highlighting",
    "social",
    "privacy",
    "secrets",
    "pillow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=9.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
codecard = "codecard.cli:main"

[project.urls]
Homepage = "https://github.com/dimhold/codecard"
Source = "https://github.com/dimhold/codecard"
Issues = "https://github.com/dimhold/codecard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codecard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# typing.List and friends are kept on purpose: the package supports 3.9, where
# the built-in generics only work behind `from __future__ import annotations`.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Keyword lists and leak-guard regexes are data, and reflowing them to 100
# columns makes them harder to read than leaving them long.
"src/codecard/languages.py" = ["E501"]
"src/codecard/guard.py" = ["E501"]
